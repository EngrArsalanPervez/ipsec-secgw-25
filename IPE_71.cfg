#SP IPv4 rules
sp ipv4 out esp protect 115 pri 1 dst 192.168.115.0/24 sport 0 : 65535 dport 0:65535
sp ipv4 in esp protect 105 pri 1 dst 192.168.105.0/24 sport 0 : 65535 dport 0:65535


#SA rules
sa out 115 aead_algo aes-256-gcm \
aead_key 6c : 1e:2f:78:b9:27:3d:f1:9c:8b:52:ff:3a:2e:5c:7d:3a:2e:5c:7d:6c:1e:2f:78:b9:27:3d:f1:9c:8b:52:ff:3a:2e:5c:7d \
mode ipv4-tunnel src 1.1.1.1 dst 2.2.2.2

sa in 105 aead_algo aes-256-gcm \
aead_key 6c : 1e:2f:78:b9:27:3d:f1:9c:8b:52:ff:3a:2e:5c:7d:3a:2e:5c:7d:6c:1e:2f:78:b9:27:3d:f1:9c:8b:52:ff:3a:2e:5c:7d \
mode ipv4-tunnel src 2.2.2.2 dst 1.1.1.1

#Routing rules
rt ipv4 dst 192.168.105.0/24 port 0
rt ipv4 dst 2.2.2.2/32 port 1

# Neighbour
neigh port 0 00 : 90:0b:d7:fd:6a